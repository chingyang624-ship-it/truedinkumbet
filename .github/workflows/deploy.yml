name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Install dependencies (root)
        run: pnpm install

      - name: Install dependencies (_NEXTJS_MIGRATION)
        run: cd _NEXTJS_MIGRATION && npm install

      - name: Build
        run: cd _NEXTJS_MIGRATION && npm run build

      - name: Build successful
        run: echo "Build completed successfully"
