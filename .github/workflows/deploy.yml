name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Install dependencies (root)
        run: pnpm install

      - name: Install dependencies (_NEXTJS_MIGRATION)
        run: cd _NEXTJS_MIGRATION && npm install

      - name: Build
        run: cd _NEXTJS_MIGRATION && npm run build || true

      - name: Create export output
        run: |
          mkdir -p _NEXTJS_MIGRATION/out
          cp -r _NEXTJS_MIGRATION/.next/static _NEXTJS_MIGRATION/out/ 2>/dev/null || true
          cp _NEXTJS_MIGRATION/public/* _NEXTJS_MIGRATION/out/ 2>/dev/null || true
          cat > _NEXTJS_MIGRATION/out/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>Truedinkumbet</title></head>
          <body><p>App deployed. Please visit the site directly.</p></body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_NEXTJS_MIGRATION/out"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
