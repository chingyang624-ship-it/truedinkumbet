name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Clean cache
        run: rm -rf node_modules .next _NEXTJS_MIGRATION/node_modules _NEXTJS_MIGRATION/.next

      - name: Install dependencies
        run: pnpm install --recursive --no-frozen-lockfile

      - name: Build
        run: cd _NEXTJS_MIGRATION && NODE_OPTIONS="--max-old-space-size=4096" pnpm run build
        timeout-minutes: 30

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_NEXTJS_MIGRATION/out"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
